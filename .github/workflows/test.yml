name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # Base deps and the dev group only: the tests need no torch and no model.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
