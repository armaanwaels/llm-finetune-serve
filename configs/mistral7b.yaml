# GPU run on one 24 GB card (Modal L4 or A10G). bf16 base weights plus LoRA on all
# attention and MLP projections, with gradient checkpointing to fit activations.
run_name: mistral7b-sql-lora
output_dir: /vol/outputs/mistral7b
model:
  id: mistralai/Mistral-7B-Instruct-v0.3
  dtype: bfloat16
  device_map: auto
data:
  id: b-mc2/sql-create-context
  n_train: 4000
  n_eval: 200
  seed: 42
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  max_length: 512
  batch_size: 4
  grad_accum: 4
  lr: 2.0e-4
  epochs: 1
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 100
  gradient_checkpointing: true
