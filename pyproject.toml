[project]
name = "llm-finetune-serve"
version = "0.1.0"
description = "LoRA fine-tune of Mistral-7B served on vLLM, with a throughput and TTFT benchmark."
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=3.0",
    "accelerate>=1.0",
    "mlflow>=2.17",
]
gpu = ["vllm>=0.6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
